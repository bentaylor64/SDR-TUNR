name: Complete initial SDR-TUNR import

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct archive and remove import staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/downloads
          cat .repo-seed/part-* > dist/downloads/SDR-TUNR-1.14.0-browser-preview.zip
          test "$(wc -c < dist/downloads/SDR-TUNR-1.14.0-browser-preview.zip)" -eq 3301906
          printf '%s  %s\n' \
            '292b735b21dcb35a8f555547dd268339d3be56867da3774c8ca8f609802da05b' \
            'dist/downloads/SDR-TUNR-1.14.0-browser-preview.zip' | sha256sum --check -
          rm -rf .repo-seed
          rm -f .github/workflows/complete-initial-import.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete SDR-TUNR public preview import'
          git push
